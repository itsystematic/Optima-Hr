name: CI

on:
  push:
    branches:
      - version-15
  pull_request:
    branches:
      - version-15
  workflow_dispatch:

concurrency:
  group: version-15-optima_hr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: App tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout app
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 18

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/requirements*.txt', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Get yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache yarn
        uses: actions/cache@v5
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y mariadb-client

      - name: Initialize bench
        run: |
          pip install frappe-bench
          bench init \
            --skip-redis-config-generation \
            --skip-assets \
            --frappe-branch version-15 \
            --python "$(which python)" \
            ~/frappe-bench
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install apps
        working-directory: /home/runner/frappe-bench
        env:
          CI: "Yes"
        run: |
          # bench init skipped redis config generation, so Frappe would point at
          # ports nothing listens on and after_install jobs fail with "Connection refused".
          bench set-config -g redis_cache "redis://127.0.0.1:6379"
          bench set-config -g redis_queue "redis://127.0.0.1:6379"
          bench set-config -g redis_socketio "redis://127.0.0.1:6379"
          bench get-app https://github.com/frappe/erpnext --branch version-15 --skip-assets
          bench get-app https://github.com/frappe/hrms --branch version-15 --skip-assets
          bench get-app optima_hr "$GITHUB_WORKSPACE" --skip-assets
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext hrms optima_hr
          bench --site test_site set-config allow_tests true

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: |
          mapfile -t test_modules < <(python - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])

          # Remove an entry once its tests run on a fresh site.
          excluded = (
              # Imports hr_ksa, which this workflow does not install.
              "optima_hr/fingerprint/tests/",
              # Reads site data (HR-EMP-00001, Article of Law 84) instead of creating its own.
              "optima_hr/optima_hr/doctype/end_of_service_benefits/test_end_of_service_benefits.py",
          )

          for path in sorted((root / "optima_hr").rglob("test_*.py")):
              relative = path.relative_to(root)
              if relative.as_posix().startswith(excluded):
                  continue
              # Skips the empty `pass` stubs that bench new-doctype generates.
              if "def test_" not in path.read_text():
                  continue
              print(".".join(relative.with_suffix("").parts))
          PY
          )

          if (( ${#test_modules[@]} == 0 )); then
            echo "::error::No test modules discovered"
            exit 1
          fi

          failed=()
          for module in "${test_modules[@]}"; do
            echo "::group::${module}"
            bench --site test_site run-tests --module "${module}" || failed+=("${module}")
            echo "::endgroup::"
          done

          if (( ${#failed[@]} )); then
            printf '::error::Failed: %s\n' "${failed[@]}"
            exit 1
          fi
